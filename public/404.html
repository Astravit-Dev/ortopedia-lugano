<!doctype html>
<html lang="es-UY">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#031c58" />
    <meta name="robots" content="noindex" />
    <title>Página no encontrada — Ortopedia Lugano</title>
    <link rel="icon" type="image/png" href="/media/marca/sello.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;800&family=Archivo+Narrow:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --azul-900: #031c58;
        --azul-800: #02358c;
        --amarillo: #ffc61a;
        --tinta: #0b1b33;
        --gris: #4d5d78;
        --linea-fuerte: #c3d0e2;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 40px 24px;
        background: #fff;
        color: var(--tinta);
        font: 400 17px/1.62 'Archivo', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 560px;
        text-align: center;
      }
      img {
        width: 84px;
        height: 84px;
        margin: 0 auto 30px;
        display: block;
      }
      .rotulo {
        font-family: 'Archivo Narrow', sans-serif;
        font-weight: 700;
        font-size: 0.75rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--azul-800);
        margin: 0 0 18px;
      }
      h1 {
        font-weight: 800;
        font-size: clamp(1.9rem, 6vw, 2.9rem);
        letter-spacing: -0.028em;
        line-height: 1.04;
        margin: 0 0 18px;
      }
      h1 span {
        background: linear-gradient(var(--amarillo), var(--amarillo)) no-repeat 0 88% / 100% 0.34em;
        padding-inline: 0.06em;
      }
      p {
        color: var(--gris);
        margin: 0 auto 32px;
        max-width: 44ch;
      }
      .acciones {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
      }
      a.btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 52px;
        padding: 0 26px;
        border-radius: 4px;
        background: var(--azul-900);
        color: #fff;
        text-decoration: none;
        font-family: 'Archivo Narrow', sans-serif;
        font-weight: 700;
        font-size: 0.9375rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        transition: background-color 0.18s ease;
      }
      a.btn:hover {
        background: var(--azul-800);
      }
      a.btn--linea {
        background: transparent;
        color: var(--azul-900);
        border: 1.5px solid var(--linea-fuerte);
      }
      a.btn--linea:hover {
        background: #f1f5fa;
        border-color: var(--azul-900);
      }
      @media (max-width: 480px) {
        a.btn {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/media/marca/sello.png" alt="Ortopedia Lugano" width="84" height="84" />
      <p class="rotulo">Error 404</p>
      <h1>Esta página <span>no existe.</span></h1>
      <p>
        Puede que el enlace esté viejo o mal escrito. Volvé al inicio para ver el catálogo, o
        escribinos por WhatsApp y te decimos si tenemos lo que estás buscando.
      </p>
      <div class="acciones">
        <a
          class="btn"
          href="https://wa.me/59893555740?text=Hola%20Ortopedia%20Lugano%2C%20quisiera%20hacer%20una%20consulta."
          target="_blank"
          rel="noreferrer"
          >Consultar por WhatsApp</a
        >
        <a class="btn btn--linea" href="/">Volver al inicio</a>
      </div>
    </main>
  </body>
</html>
